  &lt;div class=&quot;r-scroll&quot; id=&quot;rScroll&quot;&gt;&lt;div class=&quot;shell&quot;&gt;
    &lt;article class=&quot;r-art&quot; id=&quot;art-eating-patterns&quot; data-slug=&quot;eating-patterns&quot; hidden aria-labelledby=&quot;t-eating-patterns&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-eating-patterns&quot;&gt;No single food makes or breaks your health&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;Canada’s Dietary Guidelines focus on patterns: what you eat regularly, taken together, matters far more than any one food.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;4 min read&lt;/span&gt;&lt;span&gt;Based on Health Canada&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;The guidelines build healthy eating around the regular intake of vegetables, fruit, whole grains and protein foods, with plant-based protein foods chosen more often.&lt;/li&gt;&lt;li&gt;Choosing foods with mostly unsaturated fat instead of mostly saturated fat is a common feature of eating patterns linked with better health.&lt;/li&gt;&lt;li&gt;Frozen, canned and dried foods count. They’re convenient options when fresh food is out of season, costly or takes too long to prepare.&lt;/li&gt;&lt;li&gt;Water is recommended as the drink of choice.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;One meal is 1 of 21&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;A week holds about 21 meals. Select a meal to add a vegetable or fruit to it, and watch how small, repeated choices shape the pattern.&lt;/p&gt;&lt;div class=&quot;wk&quot; id=&quot;wk&quot; role=&quot;group&quot; aria-label=&quot;A week of meals&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;wk-meter&quot;&gt;&lt;div class=&quot;wk-bar&quot; aria-hidden=&quot;true&quot;&gt;&lt;span id=&quot;wkFill&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;p id=&quot;wkText&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p class=&quot;wk-msg&quot; id=&quot;wkMsg&quot;&gt;&lt;/p&gt;
&lt;button class=&quot;chip&quot; type=&quot;button&quot; id=&quot;wkReset&quot;&gt;Reset the week&lt;/button&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;You don’t need to chase the latest superfood or fear a single ingredient. What counts is what you do regularly, and small, repeatable changes are how a pattern shifts.&lt;/p&gt;&lt;p&gt;It also means an off day doesn’t undo anything. One meal is one small part of a week.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;Pick one meal you eat most weeks and add a vegetable or fruit to it. Frozen and canned count.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;Individual foods still matter for some people, for example with food allergies or specific medical conditions. Personal advice can account for that.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;Canada’s Dietary Guidelines, Section 1: Foundation for healthy eating&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Clinical guidance&lt;/span&gt;&lt;span&gt;Health Canada&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;This is the evidence base behind Canada’s Food Guide. It’s written for professionals and policy makers, so it’s detailed, but it’s the most direct view of what the guidance rests on.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://www.canada.ca/en/health-canada/services/food-guide/explore/dietary-guidelines/section-1-foundation-healthy-eating.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
  &lt;aside class=&quot;note&quot;&gt;&lt;p&gt;This digest shares general information, not personal advice. Your needs depend on your health, life stage and routines.&lt;/p&gt;&lt;a href=&quot;../nutritional-counselling/&quot; data-top&gt;Explore nutritional counselling&lt;/a&gt;&lt;/aside&gt;
&lt;/article&gt;&lt;article class=&quot;r-art&quot; id=&quot;art-fibre-go-slow&quot; data-slug=&quot;fibre-go-slow&quot; hidden aria-labelledby=&quot;t-fibre-go-slow&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-fibre-go-slow&quot;&gt;More fibre, less discomfort: go slow&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;Most people eat only about half the fibre they need. Adding it gradually, with more fluids, makes the change far more comfortable.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;3 min read&lt;/span&gt;&lt;span&gt;Based on HealthLink BC&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;Most foods contain both types of fibre. Soluble fibre can help lower cholesterol and control blood sugar; insoluble fibre helps keep bowel movements regular.&lt;/li&gt;&lt;li&gt;Eating fibre-rich foods can lower your risk of type 2 diabetes, heart disease and colon cancer.&lt;/li&gt;&lt;li&gt;Adding fibre slowly limits gas, cramping and discomfort.&lt;/li&gt;&lt;li&gt;As you eat more fibre, drink plenty of fluids, such as water, to keep bowel movements soft.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;A four-week ramp&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;Instead of changing everything at once, add one fibre-rich habit each week. Select a week to see what to add.&lt;/p&gt;&lt;div class=&quot;chips&quot; role=&quot;group&quot; aria-label=&quot;Choose a week&quot; id=&quot;rampTabs&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ramp&quot;&gt;
  &lt;div class=&quot;ramp-steps&quot; id=&quot;rampSteps&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;ramp-panel&quot; id=&quot;rampPanel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;ramp-ref&quot;&gt;&lt;strong&gt;For reference:&lt;/strong&gt; the Dietary Reference Intakes used in Canada suggest about 25 g of fibre a day for women and 38 g for men aged 19 to 50. You don’t need to count grams to benefit; the steps above move you in that direction.&lt;/p&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;If eating more fibre has made you uncomfortable before, the fibre probably wasn’t the problem. The pace may have been.&lt;/p&gt;&lt;p&gt;Building up over a few weeks, one habit at a time, gives your body time to adjust and makes the change more likely to stick.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;This week, make one swap: oats or a whole grain cereal at breakfast, with a glass of water alongside.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;Some people need to limit or change the type of fibre they eat to manage a medical condition. Persistent digestive symptoms are worth discussing with your doctor.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;Fibre and your health&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Practical guide&lt;/span&gt;&lt;span&gt;HealthLink BC&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;HealthLink BC is a provincial health service, and this fact sheet is short, practical and clear about both types of fibre. It also explains how to read fibre on a Nutrition Facts table.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://www.healthlinkbc.ca/healthlinkbc-files/fibre-and-your-health&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
  &lt;aside class=&quot;note&quot;&gt;&lt;p&gt;This digest shares general information, not personal advice. Your needs depend on your health, life stage and routines.&lt;/p&gt;&lt;a href=&quot;../nutritional-counselling/&quot; data-top&gt;Explore nutritional counselling&lt;/a&gt;&lt;/aside&gt;
&lt;/article&gt;&lt;article class=&quot;r-art&quot; id=&quot;art-flavonoids-colour&quot; data-slug=&quot;flavonoids-colour&quot; hidden aria-labelledby=&quot;t-flavonoids-colour&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-flavonoids-colour&quot;&gt;Flavonoids: reading colour on your plate&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;Flavonoid-rich foods like berries, tea, cocoa and citrus are linked with lower cardiovascular risk, though researchers urge caution in reading the results.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;4 min read&lt;/span&gt;&lt;span&gt;Based on the Linus Pauling Institute&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;Flavonoids are phytochemicals: compounds made by plants. More than 5,000 have been identified, and hundreds can exist in a single food.&lt;/li&gt;&lt;li&gt;A meta-analysis of 14 long-term studies linked higher intakes of each flavonoid group with roughly 10% lower risk of cardiovascular disease.&lt;/li&gt;&lt;li&gt;The researchers themselves flag limits: many studies didn’t measure every flavonoid group, so the results should be read with caution.&lt;/li&gt;&lt;li&gt;Some flavonoids may help blood vessels relax, which is one proposed way they could support heart health.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;A colour guide to flavonoids&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;Flavonoids come in families, and colour is a helpful, imperfect clue. Select a family to see where you’ll find it.&lt;/p&gt;&lt;div class=&quot;sw&quot; role=&quot;group&quot; aria-label=&quot;Flavonoid families&quot; id=&quot;sw&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;sw-panel&quot; id=&quot;swPanel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;sw-note&quot;&gt;Colour isn’t a perfect guide. Tea and soy don’t show their flavonoids on the outside, which is one more reason variety beats any single colour.&lt;/p&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;Eating a variety of colourful plant foods is a sensible, low-risk habit that brings fibre, vitamins and minerals along with flavonoids.&lt;/p&gt;&lt;p&gt;The evidence is promising but not settled, so there’s no need for flavonoid supplements or for treating any one food as protective.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;At one meal this week, aim for two or three different colours on your plate, and consider a cup of tea as one of them.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;These are associations from observational studies, which can’t prove cause and effect. People who eat more flavonoid-rich foods may differ in other ways too.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;Flavonoids&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Evidence review&lt;/span&gt;&lt;span&gt;the Linus Pauling Institute&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The Linus Pauling Institute’s Micronutrient Information Center reviews research in detail and is candid about limitations. It’s a strong source for going deeper.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://lpi.oregonstate.edu/mic/dietary-factors/phytochemicals/flavonoids&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
  &lt;aside class=&quot;note&quot;&gt;&lt;p&gt;This digest shares general information, not personal advice. Your needs depend on your health, life stage and routines.&lt;/p&gt;&lt;a href=&quot;../nutritional-counselling/&quot; data-top&gt;Explore nutritional counselling&lt;/a&gt;&lt;/aside&gt;
&lt;/article&gt;&lt;article class=&quot;r-art&quot; id=&quot;art-protein-across-the-day&quot; data-slug=&quot;protein-across-the-day&quot; hidden aria-labelledby=&quot;t-protein-across-the-day&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-protein-across-the-day&quot;&gt;Protein: total first, then timing&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;For active people, getting enough protein across the day comes first. Spreading it evenly is the next step, and the post-workout window is wider than you might think.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;3 min read&lt;/span&gt;&lt;span&gt;Based on the International Society of Sports Nutrition&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;The Society’s position is that meeting your total daily protein intake should be the primary focus for exercising people.&lt;/li&gt;&lt;li&gt;Spreading protein evenly across the day, roughly every three to four hours, is suggested as the next step.&lt;/li&gt;&lt;li&gt;Protein before or after a workout both help. The effect of a training session lasts at least 24 hours, so there’s no need to rush a shake.&lt;/li&gt;&lt;li&gt;Whole foods can meet protein needs. Supplements are a convenience, not a requirement.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Same protein, different day&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;Many people eat most of their protein at dinner. Switch between the two patterns to see what spreading it out looks like.&lt;/p&gt;&lt;div class=&quot;chips&quot; role=&quot;group&quot; aria-label=&quot;Choose a pattern&quot; id=&quot;pdTabs&quot;&gt;
  &lt;button type=&quot;button&quot; class=&quot;chip&quot; data-p=&quot;common&quot; aria-pressed=&quot;true&quot;&gt;A common pattern&lt;/button&gt;
  &lt;button type=&quot;button&quot; class=&quot;chip&quot; data-p=&quot;spread&quot; aria-pressed=&quot;false&quot;&gt;Spread across the day&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;pd&quot; id=&quot;pd&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;pd-msg&quot; id=&quot;pdMsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;pd-ideas&quot; id=&quot;pdIdeas&quot;&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;If you’re active, focus first on eating enough protein over the whole day. Once that’s in place, spreading it more evenly is a helpful refinement.&lt;/p&gt;&lt;p&gt;You don’t need to eat on a strict clock or rush a shake after training. A normal meal within a reasonable time works.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;If breakfast is mostly toast or cereal, add a protein food like eggs, Greek yogurt or nut butter.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;This position stand is written for healthy, exercising adults. How much protein you need depends on your body, activity and health, including kidney health.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;International Society of Sports Nutrition position stand: nutrient timing&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Clinical guidance&lt;/span&gt;&lt;span&gt;the International Society of Sports Nutrition&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Position stands summarize the research on a question and state a professional society’s view. This one is open access and clearly separates what matters most from what’s fine-tuning.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://www.tandfonline.com/doi/full/10.1186/s12970-017-0189-4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
  &lt;aside class=&quot;note&quot;&gt;&lt;p&gt;This digest shares general information, not personal advice. Your needs depend on your health, life stage and routines.&lt;/p&gt;&lt;a href=&quot;../nutritional-counselling/&quot; data-top&gt;Explore nutritional counselling&lt;/a&gt;&lt;/aside&gt;
&lt;/article&gt;&lt;article class=&quot;r-art&quot; id=&quot;art-where-water-comes-from&quot; data-slug=&quot;where-water-comes-from&quot; hidden aria-labelledby=&quot;t-where-water-comes-from&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-where-water-comes-from&quot;&gt;Where your water really comes from&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;There’s no single number of glasses you need. About a fifth of our water comes from food, and drinking when you’re thirsty works for most people.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;3 min read&lt;/span&gt;&lt;span&gt;Based on MedlinePlus (NIH)&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;There is no specific recommendation for how much plain water to drink. Needs depend on sex, weight, age, activity level and health.&lt;/li&gt;&lt;li&gt;If you drink when you feel thirsty and have beverages with meals, you should get enough water to stay hydrated.&lt;/li&gt;&lt;li&gt;Total water includes what you get from food and all beverages, and food typically supplies about 20%.&lt;/li&gt;&lt;li&gt;Choosing water over sweetened drinks helps avoid extra calories. Thirst can change as you get older.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Fill the glass&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;Select the button to see where the water in a typical day comes from, then choose a food to see how much water it holds.&lt;/p&gt;&lt;div class=&quot;hy&quot;&gt;
  &lt;div class=&quot;hy-left&quot;&gt;
    &lt;div class=&quot;glass&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;g-drink&quot; id=&quot;gDrink&quot;&gt;&lt;/div&gt;&lt;div class=&quot;g-food&quot; id=&quot;gFood&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;hy-legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;k1&quot;&gt;&lt;/i&gt;Drinks, about 80%&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;k2&quot;&gt;&lt;/i&gt;Food, about 20%&lt;/span&gt;&lt;/div&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;fill&quot;&gt;Fill the glass&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hy-right&quot;&gt;
    &lt;h3&gt;How much water is in…&lt;/h3&gt;
    &lt;div class=&quot;chips&quot; role=&quot;group&quot; aria-label=&quot;Choose a food&quot; id=&quot;foods&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hy-read&quot; id=&quot;hyRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;You don’t have to track glasses. For most healthy adults, drinking when thirsty and having a drink with meals covers it.&lt;/p&gt;&lt;p&gt;Coffee, tea and water-rich foods all contribute. Water is still the best everyday choice because it hydrates without added sugar or calories.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;Notice how you feel on days you drink less. Tiredness, headaches or dark urine can be useful signals.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;Needs rise with heat and exercise, and some medical conditions change how much fluid you should have. If that applies to you, follow your care team’s advice.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;Water in diet&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Evidence review&lt;/span&gt;&lt;span&gt;MedlinePlus (NIH)&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;MedlinePlus is the U.S. National Library of Medicine’s consumer health site. This page is short, reviewed by health professionals and free of the “eight glasses” myth.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://medlineplus.gov/ency/article/002471.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
  &lt;aside class=&quot;note&quot;&gt;&lt;p&gt;This digest shares general information, not personal advice. Your needs depend on your health, life stage and routines.&lt;/p&gt;&lt;a href=&quot;../nutritional-counselling/&quot; data-top&gt;Explore nutritional counselling&lt;/a&gt;&lt;/aside&gt;
&lt;/article&gt;&lt;article class=&quot;r-art&quot; id=&quot;art-vitamin-d-winter&quot; data-slug=&quot;vitamin-d-winter&quot; hidden aria-labelledby=&quot;t-vitamin-d-winter&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;kicker&quot;&gt;Hōlus Digest, edition 01&lt;/p&gt;
    &lt;h2 class=&quot;r-title&quot; id=&quot;t-vitamin-d-winter&quot;&gt;Vitamin D through a Canadian winter&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;Health Canada advises a daily food source of vitamin D for ages 2 to 50, and a daily 400 IU supplement from age 51. Here’s why the season matters.&lt;/p&gt;
    &lt;p class=&quot;byline&quot;&gt;&lt;span&gt;Digested by Juliana dos Santos&lt;/span&gt;&lt;span&gt;3 min read&lt;/span&gt;&lt;span&gt;Based on Health Canada&lt;/span&gt;&lt;/p&gt;
  &lt;/header&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;The short version&lt;/h3&gt;&lt;ol class=&quot;points&quot;&gt;&lt;li&gt;People aged 2 to 50 are advised to get a daily dietary source of vitamin D: foods that contain it, or a 400 IU (10 mcg) supplement if those foods aren’t eaten daily.&lt;/li&gt;&lt;li&gt;Adults 51 and older are advised to take a daily 400 IU (10 mcg) vitamin D supplement, at a life stage when bone loss becomes more likely.&lt;/li&gt;&lt;li&gt;Skin makes vitamin D from sunlight, but season, time of day, cloud cover, sunscreen, age and skin pigmentation all change how much.&lt;/li&gt;&lt;li&gt;Food sources include egg yolks, soft margarine, fatty fish like salmon, arctic char and rainbow trout, lower-fat milk and fortified plant-based beverages.&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;
  &lt;section class=&quot;centre&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Your year in vitamin D&lt;/h3&gt;&lt;p class=&quot;centre-intro&quot;&gt;Select a month to see what the sun can do, then choose your age group to see Health Canada’s advice.&lt;/p&gt;&lt;div class=&quot;yr&quot; role=&quot;group&quot; aria-label=&quot;Choose a month&quot; id=&quot;yr&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;yr-msg&quot; id=&quot;yrMsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;h3 class=&quot;vd-h&quot;&gt;Your age group&lt;/h3&gt;
&lt;div class=&quot;chips&quot; role=&quot;group&quot; aria-label=&quot;Choose an age group&quot; id=&quot;age&quot;&gt;
  &lt;button type=&quot;button&quot; class=&quot;chip&quot; data-a=&quot;young&quot; aria-pressed=&quot;true&quot;&gt;2 to 50&lt;/button&gt;
  &lt;button type=&quot;button&quot; class=&quot;chip&quot; data-a=&quot;older&quot; aria-pressed=&quot;false&quot;&gt;51 and older&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;vd-card&quot; id=&quot;vd&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;prose&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;What this means for you&lt;/h3&gt;&lt;p&gt;Your vitamin D needs don’t change in winter, but where it comes from does. As the days shorten, food sources, and a supplement if you’re 51 or older, do more of the work.&lt;/p&gt;&lt;p&gt;People with more melanin make vitamin D from sunlight more slowly, so food sources matter all year.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;try&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Try this&lt;/h3&gt;&lt;p&gt;Check the label on the milk or plant-based beverage you buy. Unsweetened, fortified options are an easy daily source.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;caveat&quot;&gt;&lt;h3 class=&quot;h&quot;&gt;Keep in mind&lt;/h3&gt;&lt;p&gt;More isn’t better: very high intakes can cause harm. Some people, such as those with conditions that affect absorption, may need different advice, so check with a health professional before changing your dose.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
  &lt;section class=&quot;source&quot;&gt;&lt;p class=&quot;source-label&quot;&gt;The original source&lt;/p&gt;&lt;h3 class=&quot;h&quot;&gt;Advice on vitamin and mineral supplementation&lt;/h3&gt;
    &lt;p class=&quot;source-meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Clinical guidance&lt;/span&gt;&lt;span&gt;Health Canada&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;This is Health Canada’s current advice, part of Canada’s Dietary Guidelines. It’s the most direct Canadian source for who should consider vitamin D and how much.&lt;/p&gt;
    &lt;a class=&quot;btn&quot; href=&quot;https://food-guide.canada.ca/en/applying-guidelines/advice-vitamin-mineral-supplementation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Read the original &lt;svg viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M14 4h6v6M20 4l-9 9&quot;/&gt;&lt;path d=&quot;M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5&quot;/&gt;&lt;/svg&gt;&lt;span class=&quot;sr&quot;&gt; (opens in a new tab)&lt;/span&gt;&lt;/a&gt;&lt;/section&gt;
